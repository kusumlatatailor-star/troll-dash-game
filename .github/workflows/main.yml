name: Build Troll Dash APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Unzip & Prepare Project
        id: prep
        run: |
          mkdir -p project_src
          unzip -o "*.zip" -d project_src
          ROOT_DIR=$(find project_src -name "settings.gradle*" -exec dirname {} \; | head -n 1)
          echo "Project root found at: $ROOT_DIR"
          cp -r "$ROOT_DIR"/. .
          rm -rf project_src
          
          PROP_FILE=$(find . -name "gradle-wrapper.properties" | head -n 1)
          if [ -f "$PROP_FILE" ]; then
            G_VER=$(grep -oE 'gradle-[0-9]+\.[0-9]+(\.[0-9]+)?' "$PROP_FILE" | head -n 1 | sed 's/gradle-//')
          fi
          if [ -z "$G_VER" ]; then
            G_VER="8.9"
          fi
          echo "Detected Gradle Version: $G_VER"
          echo "gradle_version=$G_VER" >> $GITHUB_OUTPUT

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Matching Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ steps.prep.outputs.gradle_version }}

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TrollDash-APK
          path: app/build/outputs/apk/debug/*.apk
          
